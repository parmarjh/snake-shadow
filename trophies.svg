<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 170" width="980" height="170" role="img" aria-label="Jatinkumar Parmar GitHub trophies">
<title>GitHub Trophies — parmarjh</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popIn{0%{opacity:0;transform:translateY(12px) scale(.8)}70%{opacity:1;transform:translateY(-2px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shine{0%{transform:translateX(-160px) skewX(-18deg)}55%,100%{transform:translateX(180px) skewX(-18deg)}}
.cell{opacity:0;animation:popIn .5s cubic-bezier(.2,.8,.3,1.3) forwards;transform-box:fill-box;transform-origin:center}
.shine{animation:shine 3.6s ease-in-out infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#7c5cff"/></linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c0"><rect x="10" y="10" width="150" height="150" rx="16"/></clipPath>
<clipPath id="c1"><rect x="176" y="10" width="150" height="150" rx="16"/></clipPath>
<clipPath id="c2"><rect x="342" y="10" width="150" height="150" rx="16"/></clipPath>
<clipPath id="c3"><rect x="508" y="10" width="150" height="150" rx="16"/></clipPath>
<clipPath id="c4"><rect x="674" y="10" width="150" height="150" rx="16"/></clipPath>
<clipPath id="c5"><rect x="840" y="10" width="150" height="150" rx="16"/></clipPath>
</defs>

