  <text x="85" y="128" text-anchor="middle" font-size="10.5" fill="#8892b0">S-RANK</text>
  <g clip-path="url(#c0)"><rect class="shine" x="10" y="10" width="60" height="150" fill="url(#shineg)" style="animation-delay:.4s"/></g>
</g>
