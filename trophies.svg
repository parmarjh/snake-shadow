</g>
<g class="cell" style="animation-delay:.55s">
  <rect x="508" y="10" width="150" height="150" rx="16" fill="#0c1024" stroke="url(#tg)" stroke-width="2"/>
  <text x="583" y="52" text-anchor="middle" font-size="30">📚</text>
