<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-label="Jatinkumar Parmar most used languages">
<title>Most Used Languages — parmarjh</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes grow{from{width:0}to{width:var(--w)}}
.bar{animation:grow 1.2s cubic-bezier(.2,.7,.3,1) forwards}
]]></style>
</defs>
<rect width="420" height="190" rx="14" fill="#0c1024" stroke="#26314f"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#f1f5ff">Most Used Languages</text>

<g font-size="12.5" fill="#cbd5f5">
  <text x="20" y="56">Python</text>
  <rect x="20" y="62" width="380" height="10" rx="5" fill="#1c2444"/>
  <rect class="bar" x="20" y="62" height="10" rx="5" fill="#22d3ee" style="--w:224px" width="224"><animate attributeName="width" from="0" to="224" dur="1.1s" begin=".2s" fill="freeze"/></rect>

  <text x="20" y="86">TypeScript / JavaScript</text>
  <rect x="20" y="92" width="380" height="10" rx="5" fill="#1c2444"/>
  <rect class="bar" x="20" y="92" height="10" rx="5" fill="#7c5cff" width="0"><animate attributeName="width" from="0" to="152" dur="1.1s" begin=".35s" fill="freeze"/></rect>

  <text x="20" y="116">HTML / CSS</text>
  <rect x="20" y="122" width="380" height="10" rx="5" fill="#1c2444"/>
  <rect class="bar" x="20" y="122" height="10" rx="5" fill="#fbbf24" width="0"><animate attributeName="width" from="0" to="96" dur="1.1s" begin=".5s" fill="freeze"/></rect>

  <text x="20" y="146">Shell / Docker</text>
  <rect x="20" y="152" width="380" height="10" rx="5" fill="#1c2444"/>
  <rect class="bar" x="20" y="152" height="10" rx="5" fill="#38bdf8" width="0"><animate attributeName="width" from="0" to="68" dur="1.1s" begin=".65s" fill="freeze"/></rect>

  <text x="20" y="176">Others</text>
  <rect x="20" y="180" width="0" height="0"/>
</g>
</svg>
