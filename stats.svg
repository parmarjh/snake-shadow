<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-label="Jatinkumar Parmar GitHub stats">
<title>GitHub Stats — parmarjh</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes ring{from{stroke-dashoffset:314}to{stroke-dashoffset:66}}
.row{opacity:0;animation:slideIn .5s ease forwards;transform-box:fill-box}
.ringfg{stroke-dasharray:314;stroke-dashoffset:314;animation:ring 1.6s cubic-bezier(.2,.7,.3,1) .3s forwards}
]]></style>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#7c5cff"/>
</linearGradient>
</defs>
<rect width="420" height="190" rx="14" fill="#0c1024" stroke="#26314f"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#f1f5ff">Jatinkumar Parmar's GitHub Stats</text>

<g transform="translate(70,108)">
  <circle r="50" fill="none" stroke="#1c2444" stroke-width="10"/>
  <circle class="ringfg" r="50" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" transform="rotate(-90)"/>
  <text text-anchor="middle" y="6" font-size="18" font-weight="800" fill="#fbbf24">A+</text>
</g>

<g font-size="13" fill="#cbd5f5">
  <text class="row" style="animation-delay:.5s" x="150" y="66">⭐ Total Stars <tspan x="330" fill="#f1f5ff" font-weight="700">180+</tspan></text>
  <text class="row" style="animation-delay:.65s" x="150" y="92">📦 Total Repos <tspan x="330" fill="#f1f5ff" font-weight="700">900+</tspan></text>
  <text class="row" style="animation-delay:.8s" x="150" y="118">📈 Commits (yr) <tspan x="330" fill="#f1f5ff" font-weight="700">1.2k+</tspan></text>
  <text class="row" style="animation-delay:.95s" x="150" y="144">🔀 Pull Requests <tspan x="330" fill="#f1f5ff" font-weight="700">40+</tspan></text>
  <text class="row" style="animation-delay:1.1s" x="150" y="170">👥 Followers <tspan x="330" fill="#f1f5ff" font-weight="700">growing</tspan></text>
</g>
</svg>
